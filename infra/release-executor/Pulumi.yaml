{
  "name": "ajent-release-executor",
  "runtime": "yaml",
  "description": "On-demand isolated Ajent Fargate release runner and CodeBuild image builders",
  "config": {
    "vpcId": {
      "type": "string"
    },
    "subnetId": {
      "type": "string"
    },
    "applicationRepository": {
      "type": "string",
      "default": "application-images-a0ac9e0"
    },
    "runnerImage": {
      "type": "string",
      "default": "394824061124.dkr.ecr.us-west-2.amazonaws.com/ajent-release-runner:bootstrap-not-runnable"
    },
    "jitConfig": {
      "type": "string",
      "secret": true,
      "default": "disabled"
    },
    "pulumiAccessToken": {
      "type": "string",
      "secret": true,
      "default": "disabled"
    }
  },
  "resources": {
    "awsProvider": {
      "type": "pulumi:providers:aws",
      "properties": {
        "region": "us-west-2"
      },
      "options": {
        "version": "7.44.0"
      }
    },
    "sources": {
      "type": "aws:s3:BucketV2",
      "properties": {
        "bucket": "ajent-release-sources-394824061124",
        "forceDestroy": false,
        "tags": {
          "Project": "ajent",
          "Purpose": "release-executor"
        }
      },
      "options": {
        "provider": "${awsProvider}"
      }
    },
    "sourceVersioning": {
      "type": "aws:s3:BucketVersioningV2",
      "properties": {
        "bucket": "${sources.id}",
        "versioningConfiguration": {
          "status": "Enabled"
        }
      },
      "options": {
        "provider": "${awsProvider}"
      }
    },
    "sourceEncryption": {
      "type": "aws:s3:BucketServerSideEncryptionConfigurationV2",
      "properties": {
        "bucket": "${sources.id}",
        "rules": [
          {
            "applyServerSideEncryptionByDefault": {
              "sseAlgorithm": "AES256"
            }
          }
        ]
      },
      "options": {
        "provider": "${awsProvider}"
      }
    },
    "sourcePrivacy": {
      "type": "aws:s3:BucketPublicAccessBlock",
      "properties": {
        "bucket": "${sources.id}",
        "blockPublicAcls": true,
        "blockPublicPolicy": true,
        "ignorePublicAcls": true,
        "restrictPublicBuckets": true
      },
      "options": {
        "provider": "${awsProvider}"
      }
    },
    "sourceTLS": {
      "type": "aws:s3:BucketPolicy",
      "properties": {
        "bucket": "${sources.id}",
        "policy": "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Deny\",\"Action\":\"s3:*\",\"Principal\":\"*\",\"Resource\":[\"${sources.arn}\",\"${sources.arn}/*\"],\"Condition\":{\"Bool\":{\"aws:SecureTransport\":\"false\"}}}]}"
      },
      "options": {
        "provider": "${awsProvider}",
        "dependsOn": [
          "${sources}"
        ]
      }
    },
    "sourceLifecycle": {
      "type": "aws:s3:BucketLifecycleConfigurationV2",
      "properties": {
        "bucket": "${sources.id}",
        "rules": [
          {
            "id": "expire-source-bundles",
            "status": "Enabled",
            "filter": {
              "prefix": "sources/"
            },
            "expiration": {
              "days": 7
            },
            "noncurrentVersionExpiration": {
              "noncurrentDays": 7
            },
            "abortIncompleteMultipartUpload": {
              "daysAfterInitiation": 1
            }
          }
        ]
      },
      "options": {
        "provider": "${awsProvider}",
        "dependsOn": [
          "${sourceVersioning}"
        ]
      }
    },
    "runnerRepository": {
      "type": "aws:ecr:Repository",
      "properties": {
        "name": "ajent-release-runner",
        "imageTagMutability": "IMMUTABLE",
        "imageScanningConfiguration": {
          "scanOnPush": true
        },
        "forceDelete": false,
        "tags": {
          "Project": "ajent"
        }
      },
      "options": {
        "provider": "${awsProvider}"
      }
    },
    "logs": {
      "type": "aws:cloudwatch:LogGroup",
      "properties": {
        "name": "/ajent/release-executor",
        "retentionInDays": 14,
        "tags": {
          "Project": "ajent"
        }
      },
      "options": {
        "provider": "${awsProvider}"
      }
    },
    "applicationBuilderRole": {
      "type": "aws:iam:Role",
      "properties": {
        "name": "ajent-release-applicationBuilder",
        "assumeRolePolicy": "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":\"sts:AssumeRole\",\"Principal\":{\"Service\":\"codebuild.amazonaws.com\"},\"Condition\":{\"StringEquals\":{\"aws:SourceAccount\":\"394824061124\"},\"ArnLike\":{\"aws:SourceArn\":\"arn:aws:codebuild:us-west-2:394824061124:project/ajent-release-*\"}}}]}",
        "tags": {
          "Project": "ajent"
        }
      },
      "options": {
        "provider": "${awsProvider}"
      }
    },
    "applicationBuilderPolicy": {
      "type": "aws:iam:RolePolicy",
      "properties": {
        "role": "${applicationBuilderRole.id}",
        "policy": "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:GetObjectVersion\"],\"Resource\":\"${sources.arn}/sources/*\"},{\"Effect\":\"Allow\",\"Action\":[\"s3:GetBucketLocation\"],\"Resource\":\"${sources.arn}\"},{\"Effect\":\"Allow\",\"Action\":[\"logs:CreateLogStream\",\"logs:PutLogEvents\"],\"Resource\":\"${logs.arn}:*\"},{\"Effect\":\"Allow\",\"Action\":[\"ecr:GetAuthorizationToken\"],\"Resource\":\"*\"},{\"Effect\":\"Allow\",\"Action\":[\"ecr:BatchCheckLayerAvailability\",\"ecr:CompleteLayerUpload\",\"ecr:DescribeImages\",\"ecr:DescribeRepositories\",\"ecr:InitiateLayerUpload\",\"ecr:PutImage\",\"ecr:UploadLayerPart\",\"ecr:BatchGetImage\",\"ecr:GetDownloadUrlForLayer\"],\"Resource\":\"arn:aws:ecr:us-west-2:394824061124:repository/${applicationRepository}\"}]}"
      },
      "options": {
        "provider": "${awsProvider}",
        "dependsOn": [
          "${applicationBuilderRole}",
          "${sources}",
          "${logs}"
        ]
      }
    },
    "applicationBuilder": {
      "type": "aws:codebuild:Project",
      "properties": {
        "name": "ajent-release-applicationBuilder",
        "serviceRole": "${applicationBuilderRole.arn}",
        "buildTimeout": 60,
        "queuedTimeout": 10,
        "concurrentBuildLimit": 1,
        "artifacts": {
          "type": "NO_ARTIFACTS"
        },
        "source": {
          "type": "S3",
          "location": "${sources.bucket}/sources/not-started.zip",
          "buildspec": "{\"version\": \"0.2\", \"phases\": {\"build\": {\"commands\": [\"bash scripts/aws-release-build.sh\"]}}}"
        },
        "environment": {
          "type": "ARM_CONTAINER",
          "computeType": "BUILD_GENERAL1_LARGE",
          "image": "aws/codebuild/amazonlinux-aarch64-standard:3.0",
          "privilegedMode": true
        },
        "logsConfig": {
          "cloudwatchLogs": {
            "status": "ENABLED",
            "groupName": "${logs.name}",
            "streamName": "applicationBuilder"
          }
        },
        "tags": {
          "Project": "ajent"
        }
      },
      "options": {
        "provider": "${awsProvider}",
        "dependsOn": [
          "${applicationBuilderPolicy}"
        ]
      }
    },
    "runnerBuilderRole": {
      "type": "aws:iam:Role",
      "properties": {
        "name": "ajent-release-runnerBuilder",
        "assumeRolePolicy": "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":\"sts:AssumeRole\",\"Principal\":{\"Service\":\"codebuild.amazonaws.com\"},\"Condition\":{\"StringEquals\":{\"aws:SourceAccount\":\"394824061124\"},\"ArnLike\":{\"aws:SourceArn\":\"arn:aws:codebuild:us-west-2:394824061124:project/ajent-release-*\"}}}]}",
        "tags": {
          "Project": "ajent"
        }
      },
      "options": {
        "provider": "${awsProvider}"
      }
    },
    "runnerBuilderPolicy": {
      "type": "aws:iam:RolePolicy",
      "properties": {
        "role": "${runnerBuilderRole.id}",
        "policy": "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:GetObjectVersion\"],\"Resource\":\"${sources.arn}/sources/*\"},{\"Effect\":\"Allow\",\"Action\":[\"s3:GetBucketLocation\"],\"Resource\":\"${sources.arn}\"},{\"Effect\":\"Allow\",\"Action\":[\"logs:CreateLogStream\",\"logs:PutLogEvents\"],\"Resource\":\"${logs.arn}:*\"},{\"Effect\":\"Allow\",\"Action\":[\"ecr:GetAuthorizationToken\"],\"Resource\":\"*\"},{\"Effect\":\"Allow\",\"Action\":[\"ecr:BatchCheckLayerAvailability\",\"ecr:CompleteLayerUpload\",\"ecr:DescribeImages\",\"ecr:DescribeRepositories\",\"ecr:InitiateLayerUpload\",\"ecr:PutImage\",\"ecr:UploadLayerPart\",\"ecr:BatchGetImage\",\"ecr:GetDownloadUrlForLayer\"],\"Resource\":\"${runnerRepository.arn}\"}]}"
      },
      "options": {
        "provider": "${awsProvider}",
        "dependsOn": [
          "${runnerBuilderRole}",
          "${sources}",
          "${logs}",
          "${runnerRepository}"
        ]
      }
    },
    "runnerBuilder": {
      "type": "aws:codebuild:Project",
      "properties": {
        "name": "ajent-release-runnerBuilder",
        "serviceRole": "${runnerBuilderRole.arn}",
        "buildTimeout": 30,
        "queuedTimeout": 10,
        "concurrentBuildLimit": 1,
        "artifacts": {
          "type": "NO_ARTIFACTS"
        },
        "source": {
          "type": "S3",
          "location": "${sources.bucket}/sources/not-started.zip",
          "buildspec": "runners/release/buildspec.yml"
        },
        "environment": {
          "type": "LINUX_CONTAINER",
          "computeType": "BUILD_GENERAL1_SMALL",
          "image": "aws/codebuild/standard:7.0",
          "privilegedMode": true
        },
        "logsConfig": {
          "cloudwatchLogs": {
            "status": "ENABLED",
            "groupName": "${logs.name}",
            "streamName": "runnerBuilder"
          }
        },
        "tags": {
          "Project": "ajent"
        }
      },
      "options": {
        "provider": "${awsProvider}",
        "dependsOn": [
          "${runnerBuilderPolicy}"
        ]
      }
    },
    "imageBuildRole": {
      "type": "aws:iam:Role",
      "properties": {
        "name": "ajent-release-image-build",
        "assumeRolePolicy": "{\"Version\": \"2012-10-17\", \"Statement\": [{\"Effect\": \"Allow\", \"Action\": \"sts:AssumeRoleWithWebIdentity\", \"Principal\": {\"Federated\": \"arn:aws:iam::394824061124:oidc-provider/token.actions.githubusercontent.com\"}, \"Condition\": {\"StringEquals\": {\"token.actions.githubusercontent.com:aud\": \"sts.amazonaws.com\", \"token.actions.githubusercontent.com:sub\": [\"repo:ajent-social/production-release:ref:refs/heads/main\", \"repo:ajent-social@325803062/production-release@${releaseRepositoryId}:ref:refs/heads/main\"]}}}]}",
        "tags": {
          "Project": "ajent"
        }
      },
      "options": {
        "provider": "${awsProvider}"
      }
    },
    "imageBuildPolicy": {
      "type": "aws:iam:RolePolicy",
      "properties": {
        "role": "${imageBuildRole.id}",
        "policy": "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:PutObject\",\"s3:GetObject\",\"s3:GetObjectVersion\"],\"Resource\":\"${sources.arn}/sources/*\"},{\"Effect\":\"Allow\",\"Action\":[\"s3:GetBucketLocation\"],\"Resource\":\"${sources.arn}\"},{\"Effect\":\"Allow\",\"Action\":[\"codebuild:StartBuild\",\"codebuild:StopBuild\",\"codebuild:BatchGetBuilds\"],\"Resource\":\"${applicationBuilder.arn}\"},{\"Effect\":\"Allow\",\"Action\":[\"ecr:DescribeImages\",\"ecr:DescribeRepositories\"],\"Resource\":\"arn:aws:ecr:us-west-2:394824061124:repository/${applicationRepository}\"}]}"
      },
      "options": {
        "provider": "${awsProvider}",
        "dependsOn": [
          "${imageBuildRole}",
          "${sources}",
          "${applicationBuilder}"
        ]
      }
    },
    "jitParameter": {
      "type": "aws:ssm:Parameter",
      "properties": {
        "name": "/ajent/release-executor/jit",
        "type": "SecureString",
        "value": "${jitConfig}",
        "tags": {
          "Project": "ajent"
        }
      },
      "options": {
        "provider": "${awsProvider}"
      }
    },
    "executionRole": {
      "type": "aws:iam:Role",
      "properties": {
        "name": "ajent-release-task-execution",
        "assumeRolePolicy": "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":\"sts:AssumeRole\",\"Principal\":{\"Service\":\"ecs-tasks.amazonaws.com\"},\"Condition\":{\"StringEquals\":{\"aws:SourceAccount\":\"394824061124\"},\"ArnLike\":{\"aws:SourceArn\":\"arn:aws:ecs:us-west-2:394824061124:*\"}}}]}",
        "tags": {
          "Project": "ajent"
        }
      },
      "options": {
        "provider": "${awsProvider}"
      }
    },
    "executionPolicy": {
      "type": "aws:iam:RolePolicy",
      "properties": {
        "role": "${executionRole.id}",
        "policy": "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"ecr:GetAuthorizationToken\"],\"Resource\":\"*\"},{\"Effect\":\"Allow\",\"Action\":[\"ecr:BatchGetImage\",\"ecr:GetDownloadUrlForLayer\",\"ecr:BatchCheckLayerAvailability\"],\"Resource\":\"${runnerRepository.arn}\"},{\"Effect\":\"Allow\",\"Action\":[\"logs:CreateLogStream\",\"logs:PutLogEvents\"],\"Resource\":\"${logs.arn}:*\"},{\"Effect\":\"Allow\",\"Action\":[\"ssm:GetParameters\"],\"Resource\":\"${jitParameter.arn}\"}]}"
      },
      "options": {
        "provider": "${awsProvider}",
        "dependsOn": [
          "${executionRole}",
          "${runnerRepository}",
          "${logs}",
          "${jitParameter}"
        ]
      }
    },
    "cluster": {
      "type": "aws:ecs:Cluster",
      "properties": {
        "name": "ajent-release",
        "tags": {
          "Project": "ajent"
        }
      },
      "options": {
        "provider": "${awsProvider}"
      }
    },
    "runnerSecurityGroup": {
      "type": "aws:ec2:SecurityGroup",
      "properties": {
        "name": "ajent-release-runner",
        "description": "No inbound access; HTTPS egress only",
        "vpcId": "${vpcId}",
        "ingress": [],
        "egress": [
          {
            "protocol": "tcp",
            "fromPort": 443,
            "toPort": 443,
            "cidrBlocks": [
              "0.0.0.0/0"
            ]
          }
        ],
        "tags": {
          "Project": "ajent"
        }
      },
      "options": {
        "provider": "${awsProvider}"
      }
    },
    "runnerTask": {
      "type": "aws:ecs:TaskDefinition",
      "properties": {
        "family": "ajent-release-runner",
        "cpu": "4096",
        "memory": "16384",
        "networkMode": "awsvpc",
        "requiresCompatibilities": [
          "FARGATE"
        ],
        "executionRoleArn": "${executionRole.arn}",
        "runtimePlatform": {
          "operatingSystemFamily": "LINUX",
          "cpuArchitecture": "X86_64"
        },
        "ephemeralStorage": {
          "sizeInGib": 40
        },
        "containerDefinitions": {
          "fn::toJSON": [
            {
              "name": "runner",
              "image": "${runnerImage}",
              "essential": true,
              "linuxParameters": {
                "initProcessEnabled": true
              },
              "secrets": [
                {
                  "name": "AJENT_JIT_CONFIG",
                  "valueFrom": "${jitParameter.arn}"
                }
              ],
              "logConfiguration": {
                "logDriver": "awslogs",
                "options": {
                  "awslogs-group": "${logs.name}",
                  "awslogs-region": "us-west-2",
                  "awslogs-stream-prefix": "runner"
                }
              }
            }
          ]
        },
        "tags": {
          "Project": "ajent"
        }
      },
      "options": {
        "provider": "${awsProvider}",
        "dependsOn": [
          "${executionPolicy}"
        ]
      }
    },
    "githubProvider": {
      "type": "pulumi:providers:github",
      "properties": {
        "owner": "ajent-social"
      },
      "options": {
        "version": "6.15.0"
      }
    },
    "releaseRepository": {
      "type": "github:index/repository:Repository",
      "properties": {
        "name": "production-release",
        "description": "Private owner-controlled Ajent production release workflow; no public PR execution",
        "visibility": "private",
        "autoInit": true,
        "hasIssues": false,
        "hasWiki": false,
        "deleteBranchOnMerge": true
      },
      "options": {
        "provider": "${githubProvider}",
        "protect": true
      }
    },
    "deploymentRole": {
      "type": "aws:iam:Role",
      "properties": {
        "name": "ajent-fargate-production-deploy",
        "assumeRolePolicy": "{\"Version\": \"2012-10-17\", \"Statement\": [{\"Effect\": \"Allow\", \"Action\": \"sts:AssumeRoleWithWebIdentity\", \"Principal\": {\"Federated\": \"arn:aws:iam::394824061124:oidc-provider/token.actions.githubusercontent.com\"}, \"Condition\": {\"StringEquals\": {\"token.actions.githubusercontent.com:aud\": \"sts.amazonaws.com\", \"token.actions.githubusercontent.com:sub\": [\"repo:ajent-social/production-release:ref:refs/heads/main\", \"repo:ajent-social@325803062/production-release@${releaseRepositoryId}:ref:refs/heads/main\"]}}}]}",
        "tags": {
          "Project": "ajent",
          "Purpose": "production-release"
        }
      },
      "options": {
        "provider": "${awsProvider}"
      }
    },
    "deploymentPolicy": {
      "type": "aws:iam:RolePolicy",
      "properties": {
        "role": "${deploymentRole.id}",
        "policy": "{\"Version\": \"2012-10-17\", \"Statement\": [{\"Action\": [\"ecr:GetAuthorizationToken\"], \"Effect\": \"Allow\", \"Resource\": \"*\", \"Sid\": \"ECRAuthorization\"}, {\"Action\": [\"ecr:BatchCheckLayerAvailability\", \"ecr:CompleteLayerUpload\", \"ecr:DescribeImages\", \"ecr:InitiateLayerUpload\", \"ecr:PutImage\", \"ecr:UploadLayerPart\"], \"Condition\": {\"StringEquals\": {\"aws:ResourceTag/Project\": \"ajent\"}}, \"Effect\": \"Allow\", \"Resource\": \"arn:aws:ecr:us-west-2:394824061124:repository/application-images-*\", \"Sid\": \"AjentImagePublish\"}, {\"Action\": [\"ec2:CreateLaunchTemplateVersion\"], \"Condition\": {\"StringEquals\": {\"aws:ResourceTag/Project\": \"ajent\"}}, \"Effect\": \"Allow\", \"Resource\": \"arn:aws:ec2:us-west-2:394824061124:launch-template/*\", \"Sid\": \"AjentLaunchTemplateVersion\"}, {\"Action\": [\"ec2:RunInstances\"], \"Condition\": {\"ArnEquals\": {\"ec2:LaunchTemplate\": \"arn:aws:ec2:us-west-2:394824061124:launch-template/lt-053e4c8f50d1233a3\"}}, \"Effect\": \"Allow\", \"Resource\": [\"arn:aws:ec2:us-west-2:394824061124:network-interface/*\", \"arn:aws:ec2:us-west-2:394824061124:instance/*\", \"arn:aws:ec2:us-west-2:394824061124:volume/*\"], \"Sid\": \"AjentTemplateLaunchResources\"}, {\"Action\": [\"ec2:RunInstances\"], \"Condition\": {\"ArnEquals\": {\"ec2:LaunchTemplate\": \"arn:aws:ec2:us-west-2:394824061124:launch-template/lt-053e4c8f50d1233a3\"}, \"Bool\": {\"ec2:IsLaunchTemplateResource\": \"true\"}}, \"Effect\": \"Allow\", \"Resource\": [\"arn:aws:ec2:us-west-2::image/*\", \"arn:aws:ec2:us-west-2:394824061124:security-group/*\"], \"Sid\": \"AjentTemplateReferencedResources\"}, {\"Action\": [\"ec2:RunInstances\"], \"Condition\": {\"StringEquals\": {\"aws:ResourceTag/Project\": \"ajent\"}}, \"Effect\": \"Allow\", \"Resource\": \"arn:aws:ec2:us-west-2:394824061124:launch-template/lt-053e4c8f50d1233a3\", \"Sid\": \"AjentTemplateLaunchAdmission\"}, {\"Action\": [\"ec2:RunInstances\"], \"Condition\": {\"ArnEquals\": {\"ec2:LaunchTemplate\": \"arn:aws:ec2:us-west-2:394824061124:launch-template/lt-053e4c8f50d1233a3\"}}, \"Effect\": \"Allow\", \"Resource\": [\"arn:aws:ec2:us-west-2:394824061124:subnet/subnet-048cd741f2c9b711b\", \"arn:aws:ec2:us-west-2:394824061124:subnet/subnet-02e4ab41794425c49\"], \"Sid\": \"AjentFleetSubnetLaunchAdmission\"}, {\"Action\": [\"autoscaling:UpdateAutoScalingGroup\"], \"Condition\": {\"Bool\": {\"autoscaling:LaunchTemplateVersionSpecified\": \"true\"}, \"StringEquals\": {\"aws:ResourceTag/Project\": \"ajent\"}}, \"Effect\": \"Allow\", \"Resource\": \"arn:aws:autoscaling:us-west-2:394824061124:autoScalingGroup:*:autoScalingGroupName/application-fleet-*\", \"Sid\": \"AjentAutoscalingGroupUpdate\"}, {\"Action\": [\"autoscaling:StartInstanceRefresh\"], \"Condition\": {\"StringEquals\": {\"aws:ResourceTag/Project\": \"ajent\"}}, \"Effect\": \"Allow\", \"Resource\": \"arn:aws:autoscaling:us-west-2:394824061124:autoScalingGroup:*:autoScalingGroupName/application-fleet-*\", \"Sid\": \"AjentStartInstanceRefresh\"}, {\"Action\": [\"autoscaling:DescribeAutoScalingGroups\", \"autoscaling:DescribeInstanceRefreshes\", \"ec2:DescribeAvailabilityZones\", \"ec2:DescribeLaunchTemplates\", \"ec2:DescribeLaunchTemplateVersions\", \"elasticloadbalancing:DescribeTargetHealth\"], \"Effect\": \"Allow\", \"Resource\": \"*\", \"Sid\": \"AjentReleaseRead\"}, {\"Action\": [\"iam:PassRole\"], \"Condition\": {\"StringEquals\": {\"iam:PassedToService\": \"ec2.amazonaws.com\"}}, \"Effect\": \"Allow\", \"Resource\": \"arn:aws:iam::394824061124:role/host-9a2c0c8\", \"Sid\": \"PassAjentRuntimeRoleToEC2\"}]}"
      },
      "options": {
        "provider": "${awsProvider}"
      }
    },
    "releaseWorkflow": {
      "type": "github:index/repositoryFile:RepositoryFile",
      "properties": {
        "repository": "${releaseRepository.name}",
        "branch": "main",
        "file": ".github/workflows/release.yml",
        "content": {
          "fn::readFile": "../../runners/release/workflow.yml"
        },
        "commitMessage": "Configure reviewed isolated production release workflow",
        "overwriteOnCreate": false
      },
      "options": {
        "provider": "${githubProvider}"
      }
    },
    "variableAWS_DEPLOY_ROLE_ARN": {
      "type": "github:index/actionsVariable:ActionsVariable",
      "properties": {
        "repository": "${releaseRepository.name}",
        "variableName": "AWS_DEPLOY_ROLE_ARN",
        "value": "${deploymentRole.arn}"
      },
      "options": {
        "provider": "${githubProvider}"
      }
    },
    "variablePULUMI_STACK": {
      "type": "github:index/actionsVariable:ActionsVariable",
      "properties": {
        "repository": "${releaseRepository.name}",
        "variableName": "PULUMI_STACK",
        "value": "david-sire-run/ajent-infra/production"
      },
      "options": {
        "provider": "${githubProvider}"
      }
    },
    "variableAJENT_IMAGE_BUILD_ROLE_ARN": {
      "type": "github:index/actionsVariable:ActionsVariable",
      "properties": {
        "repository": "${releaseRepository.name}",
        "variableName": "AJENT_IMAGE_BUILD_ROLE_ARN",
        "value": "${imageBuildRole.arn}"
      },
      "options": {
        "provider": "${githubProvider}"
      }
    },
    "variableAJENT_IMAGE_BUILD_PROJECT": {
      "type": "github:index/actionsVariable:ActionsVariable",
      "properties": {
        "repository": "${releaseRepository.name}",
        "variableName": "AJENT_IMAGE_BUILD_PROJECT",
        "value": "${applicationBuilder.name}"
      },
      "options": {
        "provider": "${githubProvider}"
      }
    },
    "variableAJENT_RELEASE_SOURCE_BUCKET": {
      "type": "github:index/actionsVariable:ActionsVariable",
      "properties": {
        "repository": "${releaseRepository.name}",
        "variableName": "AJENT_RELEASE_SOURCE_BUCKET",
        "value": "${sources.bucket}"
      },
      "options": {
        "provider": "${githubProvider}"
      }
    },
    "pulumiToken": {
      "type": "github:index/actionsSecret:ActionsSecret",
      "properties": {
        "repository": "${releaseRepository.name}",
        "secretName": "PULUMI_ACCESS_TOKEN",
        "plaintextValue": "${pulumiAccessToken}"
      },
      "options": {
        "provider": "${githubProvider}"
      }
    }
  },
  "outputs": {
    "sourceBucket": "${sources.bucket}",
    "runnerRepository": "${runnerRepository.repositoryUrl}",
    "imageBuildRoleArn": "${imageBuildRole.arn}",
