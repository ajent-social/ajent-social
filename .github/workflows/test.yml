name: Go and PostgreSQL
on: [push, pull_request]
permissions:
  contents: read
jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci --prefix infra
      - run: npm run --prefix infra check
      - run: npm run --prefix infra test
      - run: npm audit --prefix infra
      - run: shellcheck scripts/container-smoke.sh scripts/publish-image.sh
  container:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: docker build --platform linux/arm64 --label "org.opencontainers.image.revision=$GITHUB_SHA" -t ajent:ci .
      - run: scripts/container-smoke.sh ajent:ci
      - run: docker save ajent:ci | gzip > ajent-arm64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ajent-arm64-${{ github.sha }}
          path: ajent-arm64.tar.gz
          retention-days: 1
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ajent_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ajent_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: python3 -m unittest discover -s internal/web/onboarding -p '*test.py'
      - run: scripts/test.sh
        env:
          AJENT_TEST_DSN: postgres://postgres:test@localhost:5432/ajent_test?sslmode=disable
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: artifacts/verification/
