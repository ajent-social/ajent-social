name: Go and PostgreSQL
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  infrastructure:
    timeout-minutes: 90
    # Heavy Pulumi SDK compile stays on x64 (7.6 GiB). Arm64 was OOM-killed on t4g.medium.
    runs-on: [self-hosted, linux, X64]
    env:
      CGO_ENABLED: '0'
      GOMAXPROCS: '1'
      GOFLAGS: '-p=1'
      GOGC: '20'
      GOMEMLIMIT: '5GiB'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: infra/go.mod
          cache: false
      - uses: actions/cache/restore@v4
        id: infra-cache
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-infra-go-${{ hashFiles('infra/go.mod', 'infra/go.sum') }}-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-infra-go-${{ hashFiles('infra/go.mod', 'infra/go.sum') }}-
      - run: go mod download
        working-directory: infra
      # DNS no longer imports the monolithic generated Cloudflare SDK.
      # Compile and test the production program and its resource-parity fixtures.
      - run: go test -vet=off -v ./...
        working-directory: infra
      - run: python3 -m unittest discover -s infra/tests -p '*_test.py'
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
        working-directory: infra
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test public-site/worker.test.mjs public-site/wiki/wiki.test.mjs
      - run: node public-site/wiki/build-app.mjs --check
      - run: shellcheck scripts/container-smoke.sh scripts/publish-image.sh internal/web/onboarding/install.sh scripts/test-dns-browser.sh
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.infra-cache.outputs.cache-primary-key }}
  ui:
    runs-on: [self-hosted, linux, arm64]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ajent_browser
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ajent_browser"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Ensure PostgreSQL client for isolated DNS verification
        run: |
          if ! command -v createdb >/dev/null || ! command -v dropdb >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Isolated DNS proof browser verification
        run: |
          export AGENT_BROWSER_EXECUTABLE_PATH="$(node -p 'require("playwright").chromium.executablePath()')"
          scripts/test-dns-browser.sh
        env:
          AJENT_DNS_BROWSER_ADMIN_DSN: postgres://postgres:test@127.0.0.1:5432/ajent_browser?sslmode=disable
      - name: Browser journeys against independent real server sessions
        run: |
          mkdir -p artifacts
          go build -o artifacts/ajentd ./cmd/ajentd
          # Each suite represents a separate session. Do not let fast, uncached
          # asset loads from earlier suites consume the next suite's IP budget.
          for suite in account feed help storage pointer conversion group question goal; do
            mkdir -p "artifacts/$suite-journeys"
            artifacts/ajentd -addr 127.0.0.1:55440 > "artifacts/$suite-journeys/server.log" 2>&1 &
            server_pid=$!
            trap 'kill "$server_pid"; wait "$server_pid" || true' EXIT
            for attempt in {1..100}; do
              if curl -fsS "$AJENT_BROWSER_ORIGIN/healthz" > /dev/null; then break; fi
              sleep 0.2
            done
            curl -fsS "$AJENT_BROWSER_ORIGIN/healthz"
            node "scripts/ui-$suite-journeys.mjs"
            kill "$server_pid"
            wait "$server_pid" || true
            trap - EXIT
          done
        env:
          AJENT_DSN: postgres://postgres:test@localhost:5432/ajent_browser?sslmode=disable
          AJENT_SETUP_TOKEN: synthetic-browser-test-setup-token-only
          AJENT_ORIGIN: http://localhost:55440
          AJENT_BROWSER_ORIGIN: http://localhost:55440
      - run: go test ./internal/web -run '^TestVisualFixtures$' -count=1 -v
        env:
          AJENT_VISUAL_OUTPUT: ${{ github.workspace }}/artifacts/ui
      - run: node scripts/ui-contrast.mjs
        env:
          AJENT_UI_BROWSERS: chromium,webkit,firefox
          AJENT_VISUAL_OUTPUT: ${{ github.workspace }}/artifacts/ui
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: ui-contrast
          retention-days: 3
          path: |
            artifacts/ui
            artifacts/account-journeys
            artifacts/feed-journeys
            artifacts/help-journeys
            artifacts/storage-journeys
            artifacts/pointer-journeys
            artifacts/conversion-journeys
            artifacts/group-journeys
            artifacts/question-journeys
            artifacts/goals
  container:
    runs-on: [self-hosted, linux, arm64]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --platform linux/arm64 --build-arg "AJENT_REVISION=$GITHUB_SHA" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t ajent:ci .
      - run: scripts/container-smoke.sh ajent:ci
      - run: docker save ajent:ci | gzip > ajent-arm64.tar.gz
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ajent-arm64-${{ github.sha }}
          path: ajent-arm64.tar.gz
          retention-days: 1
  test:
    # Keep API/race checks independent of the arm64 browser/image queue.
    runs-on: [self-hosted, linux, X64]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ajent_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ajent_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify installer readiness boundaries
        run: go test ./internal/web -run '^(TestUnconfiguredInstallersFailClosed|TestConfiguredInstallersContainOnlyValidatedPublicKey|TestInstallerReleaseActivationRequiresPinnedPublicDistribution|TestHumanDashboardRespectsInstallerReadiness|TestPythonOnboardingAssetsAreRetired|TestGoOnboardingAssetsAreServed|TestJoinUsesGoSetupPromptAndPlatformInstallers|TestCanonicalOnboardingDuringMigration)$' -count=1 -v
      - name: Verify signed Unix and PowerShell installers
        env:
          AJENT_INSTALLER_TEST_REQUIRE_PWSH: '1'
        run: |
          pwsh_dir=$(mktemp -d "$RUNNER_TEMP/ajent-pwsh.XXXXXX")
          trap 'rm -rf "$pwsh_dir"' EXIT
          curl -fsSL --retry 3 https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/powershell-7.6.6-linux-x64.tar.gz -o "$pwsh_dir/powershell.tar.gz"
          printf '%s  %s\n' ddbc4a2d113bbd46d283cfedcbcd117a70caefd7673f41f2b4e0000badf103bc "$pwsh_dir/powershell.tar.gz" | sha256sum -c -
          tar -xzf "$pwsh_dir/powershell.tar.gz" -C "$pwsh_dir"
          chmod +x "$pwsh_dir/pwsh"
          export AJENT_INSTALLER_TEST_PWSH="$pwsh_dir/pwsh"
          python3 -m unittest discover -s scripts -p '*_test.py'
      - run: go build ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - uses: actions/checkout@v4
        with:
          repository: ajent-social/ajent
          ref: 6a5255e9fca55e9e3753368e75935e2a554d01c6
          path: artifacts/go-client-source
          persist-credentials: false
      - name: Build the reviewed Go client for enrollment tests
        working-directory: artifacts/go-client-source
        run: go build -trimpath -o "$RUNNER_TEMP/ajent-go-client" ./cmd/ajent
      - run: scripts/test.sh
        env:
          AJENT_TEST_DSN: postgres://postgres:test@localhost:5432/ajent_test?sslmode=disable
          AJENT_GO_CLIENT_TEST_BINARY: ${{ runner.temp }}/ajent-go-client
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: verification
          retention-days: 3
          path: artifacts/verification/
